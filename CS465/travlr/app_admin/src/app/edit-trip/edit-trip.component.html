<div class="container">
  <h2>Edit Trip</h2>

  <p class="alert alert-warning" *ngIf="message">{{ message }}</p>

  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

    <div class="form-group mb-3">
      <label for="code">Code</label>
      <input type="text" class="form-control" formControlName="code" readonly>
    </div>

    <div class="form-group mb-3">
      <label for="name">Name</label>
      <input type="text" class="form-control" formControlName="name"
             [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
      <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
        <div *ngIf="f['name'].errors['required']">Name is required</div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="length">Length</label>
      <input type="text" class="form-control" formControlName="length"
             [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">
      <div *ngIf="submitted && f['length'].errors" class="invalid-feedback">
        <div *ngIf="f['length'].errors['required']">Length is required</div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="start">Start Date</label>
      <input type="date" class="form-control" formControlName="start"
             [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">
      <div *ngIf="submitted && f['start'].errors" class="invalid-feedback">
        <div *ngIf="f['start'].errors['required']">Start date is required</div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="resort">Resort</label>
      <input type="text" class="form-control" formControlName="resort"
             [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">
      <div *ngIf="submitted && f['resort'].errors" class="invalid-feedback">
        <div *ngIf="f['resort'].errors['required']">Resort is required</div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="perPerson">Per Person</label>
      <input type="text" class="form-control" formControlName="perPerson"
             [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">
      <div *ngIf="submitted && f['perPerson'].errors" class="invalid-feedback">
        <div *ngIf="f['perPerson'].errors['required']">Per person price is required</div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="image">Image</label>
      <input type="text" class="form-control" formControlName="image"
             [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">
      <div *ngIf="submitted && f['image'].errors" class="invalid-feedback">
        <div *ngIf="f['image'].errors['required']">Image is required</div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="description">Description</label>
      <textarea class="form-control" rows="4" formControlName="description"
                [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"></textarea>
      <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
        <div *ngIf="f['description'].errors['required']">Description is required</div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
