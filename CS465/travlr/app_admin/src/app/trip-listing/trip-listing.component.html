<div class="row">
  <div class="col-12">
    <h1>Travlr Getaways Trips</h1>
    <button class="btn btn-success mb-3" (click)="addTrip()">
      Add Trip
    </button>
  </div>
</div>

<div class="row" *ngIf="message">
  <div class="col-12">
    <p class="alert alert-warning">{{ message }}</p>
  </div>
</div>

<div class="row">
  <div class="col-md-4" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip" (tripDeleted)="onTripDeleted()"></app-trip-card>
  </div>
</div>
